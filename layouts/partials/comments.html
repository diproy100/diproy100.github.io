{{- /* Giscus comments. Shown when site param `comments` is true, unless a post sets `comments: false`. */ -}}
{{- $g := site.Params.giscus -}}
{{- if and $g $g.repoId $g.categoryId -}}
<div class="giscus-wrapper" style="margin-top: 2.5rem;">
  <div class="giscus"></div>
</div>
<script>
  (function () {
    function isDark() {
      return document.body.classList.contains("dark") ||
             document.documentElement.getAttribute("data-theme") === "dark";
    }
    var s = document.createElement("script");
    s.src = "https://giscus.app/client.js";
    s.setAttribute("data-repo", {{ $g.repo }});
    s.setAttribute("data-repo-id", {{ $g.repoId }});
    s.setAttribute("data-category", {{ $g.category }});
    s.setAttribute("data-category-id", {{ $g.categoryId }});
    s.setAttribute("data-mapping", {{ $g.mapping | default "pathname" }});
    s.setAttribute("data-strict", "0");
    s.setAttribute("data-reactions-enabled", {{ $g.reactionsEnabled | default "1" }});
    s.setAttribute("data-emit-metadata", "0");
    s.setAttribute("data-input-position", {{ $g.inputPosition | default "bottom" }});
    s.setAttribute("data-theme", isDark() ? "dark" : "light");
    s.setAttribute("data-lang", {{ $g.lang | default "en" }});
    s.setAttribute("data-loading", "lazy");
    s.crossOrigin = "anonymous";
    s.async = true;
    document.querySelector(".giscus-wrapper").appendChild(s);

    // Keep the comment box in sync with the site's dark/light toggle
    function syncTheme() {
      var frame = document.querySelector("iframe.giscus-frame");
      if (!frame) return;
      frame.contentWindow.postMessage(
        { giscus: { setConfig: { theme: isDark() ? "dark" : "light" } } },
        "https://giscus.app"
      );
    }
    var obs = new MutationObserver(syncTheme);
    obs.observe(document.body, { attributes: true, attributeFilter: ["class"] });
    obs.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  })();
</script>
{{- end -}}
