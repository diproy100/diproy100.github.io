baseURL: "https://diproy100.github.io/"
languageCode: "en-us"
title: "Dipayan Roy"
theme: "PaperMod"

enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

# JSON output on the home page powers the site search
outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags

params:
  env: production
  title: "Dipayan Roy"
  description: "EPM Architect writing about Enterprise Performance Management, OneStream, Hyperion, Fintech and software engineering."
  keywords: [EPM, OneStream, Hyperion, Essbase, PBCS, Fintech, CPM, Software Engineering]
  author: "Dipayan Roy"
  images: ["images/profile.jpg"]   # default social-share preview image

  defaultTheme: auto          # follows the visitor's system setting; toggle in the header
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false
  hideFooter: false
  disableSpecial1stPost: false

  # ---- Comments (Giscus) ----
  # comments: true turns comments on site-wide.
  # Turn them OFF for a single post by adding `comments: false` to that post's front matter.
  comments: true
  giscus:
    repo: "diproy100/diproy100.github.io"
    repoId: ""          # <-- paste from https://giscus.app (see README, step 4)
    category: "Announcements"
    categoryId: ""      # <-- paste from https://giscus.app (see README, step 4)
    mapping: "pathname"
    reactionsEnabled: "1"
    inputPosition: "bottom"
    lang: "en"

  # ---- Analytics (GoatCounter) ----
  # Leave empty to disable. Put only your site code, e.g. "diproy100"
  goatcounter: ""

  # ---- Home page (profile mode) ----
  profileMode:
    enabled: true
    title: "Dipayan Roy"
    subtitle: "EPM Architect · OneStream & Hyperion · More than a decade in Enterprise Performance Management. I write about EPM, Fintech and software engineering."
    imageUrl: "images/profile.jpg"
    imageWidth: 180
    imageHeight: 180
    imageTitle: "Dipayan Roy"
    buttons:
      - name: "Blog"
        url: "posts/"
      - name: "About"
        url: "about/"
      - name: "Experience"
        url: "experience/"
      - name: "Contact"
        url: "contact/"

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/dipayanroy100/"
    - name: github
      url: "https://github.com/diproy100"
    - name: email
      url: "mailto:dipayanroy100@gmail.com"
    - name: rss
      url: "index.xml"

  editPost:
    URL: ""
    disabled: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Blog
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: experience
      name: Experience
      url: /experience/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 50
    - identifier: search
      name: Search
      url: /search/
      weight: 60
    - identifier: contact
      name: Contact
      url: /contact/
      weight: 70

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: dracula
